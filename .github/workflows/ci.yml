name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Core is zero-dependency
        run: cargo tree -p pragmatic --no-default-features --edges normal | tail -n +2 | grep -q . && exit 1 || echo "core has no runtime deps"
      - name: Test (debug)
        run: cargo test --workspace
      - name: Test (release, headline numbers)
        run: cargo test --workspace --release -- --nocapture
      - name: Examples
        run: |
          cargo run --release -p pragmatic --example research_agent
          cargo run --release -p pragmatic --example tool_use_retries
          cargo run --release -p pragmatic --example map_reduce
      - name: CLI smoke test
        run: |
          cargo run --release -p pragmatic-cli --example seed_demo -- /tmp/demo
          cargo run --release -p pragmatic-cli -- runs --dir /tmp/demo
          cargo run --release -p pragmatic-cli -- verify --all --dir /tmp/demo
          cargo run --release -p pragmatic-cli -- export research-42 --dir /tmp/demo -o /tmp/run.html

  msrv-and-min:
    name: core builds without default features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check -p pragmatic --no-default-features
